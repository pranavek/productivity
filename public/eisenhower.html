<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix - Prioritize Tasks</title>
    <link rel="stylesheet" href="css/style.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app" v-cloak>
        <main class="notion-main">
        <header class="page-header">
            <div class="header-content">
                <div>
                    <h1>🎯 Eisenhower Matrix</h1>
                    <p class="subtitle">Focus on what's important, not just urgent</p>
                </div>
                <div class="nav-dropdown">
                    <select class="page-selector" onchange="if(this.value) window.location.href=this.value">
                        <option value="/index.html">📅 Calendar</option>
                        <option value="" selected>🎯 Eisenhower Matrix</option>
                        <option value="/moscow.html">🏗️ MoSCoW Method</option>
                        <option value="/journal.html">📝 Journal</option>
                        <option value="/wsjf.html">⚖️ WSJF</option>
                    </select>
                </div>
            </div>
        </header>

        <section class="input-section">
            <div class="input-group">
                <input type="text" v-model="newTaskText" @keyup.enter="addTask" placeholder="What needs to be done?"
                    autocomplete="off">
            </div>
            <div class="select-group">
                <select v-model="newTaskQuadrant">
                    <option value="q1">Urgent & Important (Do)</option>
                    <option value="q2">Not Urgent & Important (Schedule)</option>
                    <option value="q3">Urgent & Not Important (Delegate)</option>
                    <option value="q4">Not Urgent & Not Important (Eliminate)</option>
                </select>
            </div>
            <button @click="addTask" class="primary-btn">
                <span>Add Task</span>
            </button>
        </section>

        <main class="matrix-container">
            <!-- X Axis Labels -->
            <div class="axis-label-row">
                <div>Urgent</div>
                <div>Not Urgent</div>
            </div>

            <!-- Y Axis Labels -->
            <div class="axis-label-col">
                <div>Important</div>
                <div>Not Important</div>
            </div>

            <!-- Quadrants -->
            <div v-for="q in quadrants" :key="q.id" :class="['quadrant', q.id]">
                <div class="quadrant-header">
                    <span class="quadrant-title">{{ q.title }}</span>
                    <span class="quadrant-tag">{{ q.label }}</span>
                </div>
                <div class="task-list">
                    <!-- Uncompleted Tasks -->
                    <div v-for="task in getTasks(q.id, false)" :key="task.id"
                        :class="['task-item', { 'calendar-event': task.type === 'calendar' }]">
                        <input type="checkbox" class="task-checkbox" v-model="task.completed"
                            @change="updateTask(task)">
                        <span v-if="task.type === 'calendar'" class="calendar-badge" :title="'Calendar event: ' + task.date">
                            📅
                        </span>
                        <span class="task-text">{{ task.text }}</span>
                        <span v-if="task.type === 'calendar' && task.date" class="date-badge">
                            {{ formatDateShort(task.date) }}
                        </span>
                        <button v-if="task.type !== 'calendar'" class="delete-task" @click="deleteTask(task.id)" title="Delete Task">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Completed Tasks Separator -->
                    <div v-if="hasCompleted(q.id)" class="completed-separator">Completed</div>

                    <!-- Completed Tasks -->
                    <div v-for="task in getTasks(q.id, true)" :key="task.id"
                        :class="['task-item', 'completed', { 'calendar-event': task.type === 'calendar' }]">
                        <input type="checkbox" class="task-checkbox" v-model="task.completed"
                            @change="updateTask(task)">
                        <span v-if="task.type === 'calendar'" class="calendar-badge" :title="'Calendar event: ' + task.date">
                            📅
                        </span>
                        <span class="task-text">{{ task.text }}</span>
                        <span v-if="task.type === 'calendar' && task.date" class="date-badge">
                            {{ formatDateShort(task.date) }}
                        </span>
                        <button v-if="task.type !== 'calendar'" class="delete-task" @click="deleteTask(task.id)" title="Delete Task">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/api-client.min.js"></script>
    <script src="js/eisenhower-vue.min.js"></script>
</body>

</html>
