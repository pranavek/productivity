version: '3.8'

services:
  productivity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productivity-suite
    ports:
      - "9191:3000"
    volumes:
      # Persist database on host machine
      - ./data:/app/data
      # Development mounts (uncomment for live code changes)
      # WARNING: With volumes enabled, assets will be minified on EVERY container start
      # - ./public:/app/public
      # - ./server:/app/server
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
